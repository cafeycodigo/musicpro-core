<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bodega WMS | Editar Usuario del Sistema</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            heading: ['"Outfit"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <script src="../../shared/modal-system.js"></script>
  <script src="../../shared/admin-sidebar.js"></script>
</head>
<body class="min-h-full flex font-sans text-slate-800">

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 z-20">
      <div class="flex items-center gap-2 text-xs text-slate-500">
        <a href="index.html" class="hover:text-slate-800">Bodega WMS</a>
        <span>/</span>
        <a href="usuarios-list.html" class="hover:text-slate-800">Usuarios del Sistema</a>
        <span>/</span>
        <span class="font-semibold text-slate-800">Editar Usuario</span>
      </div>
      <a href="usuarios-list.html" class="p-2 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition">
        <i class="fa-solid fa-xmark"></i>
      </a>
    </header>

    <main class="flex-1 overflow-y-auto p-6 sm:p-8 max-w-4xl mx-auto w-full">
      <div class="mb-6 flex items-center justify-between">
        <div>
          <h1 class="font-heading font-extrabold text-2xl text-slate-900 tracking-tight">Editar Usuario: Juan Bustamante</h1>
          <p class="text-slate-500 text-xs sm:text-sm mt-0.5">Actualizar datos de cuenta, rol WMS y restablecer contraseña de acceso.</p>
        </div>
        <a href="usuarios-list.html" class="text-xs font-semibold text-slate-500 hover:text-slate-800 flex items-center gap-1.5">
          <i class="fa-solid fa-arrow-left"></i> Volver a la Lista
        </a>
      </div>

      <form onsubmit="event.preventDefault(); alert('Cambios guardados exitosamente.'); window.location.href='usuarios-list.html';" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8 space-y-6">
        
        <div class="border-b border-slate-100 pb-4 flex items-center justify-between">
          <h2 class="font-heading font-bold text-base text-slate-900 flex items-center gap-2">
            <i class="fa-solid fa-id-card text-amber-500"></i> Información de Cuenta #WMS-001
          </h2>
          <span class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">Activo</span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">RUT Chileno</label>
            <input type="text" value="15.432.109-K" readonly class="w-full px-3.5 py-2.5 bg-slate-100 border border-slate-200 rounded-xl text-xs font-mono text-slate-500 cursor-not-allowed">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Nombre Completo *</label>
            <input type="text" value="Juan Bustamante Pardo" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-amber-500">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Correo Electrónico Corporativo *</label>
            <input type="email" value="juan.bustamante@musicpro.cl" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-amber-500">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Teléfono Móvil / Anexo</label>
            <input type="tel" value="+56 9 9123 4567" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-amber-500">
          </div>
        </div>

        <div class="border-b border-slate-100 pb-4 pt-2">
          <h2 class="font-heading font-bold text-base text-slate-900 flex items-center gap-2">
            <i class="fa-solid fa-user-lock text-amber-500"></i> Rol Operativo & Asignación
          </h2>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Rol WMS *</label>
            <select required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-amber-500">
              <option value="JEFE_BODEGA" selected>Jefe de Bodega Central</option>
              <option value="SUPERVISOR">Supervisor de Turno</option>
              <option value="OPERADOR">Operador WMS (Picking & Racks)</option>
              <option value="AUDITOR">Auditor de Inventario</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Centro / Sucursal *</label>
            <select required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-amber-500">
              <option value="PUDAHUEL" selected>Bodega Central Pudahuel</option>
              <option value="PROVIDENCIA">Sucursal Providencia</option>
              <option value="MAIPU">Sucursal Maipú</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Cambiar Contraseña (Opcional)</label>
            <input type="password" placeholder="Dejar en blanco para mantener la actual" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-amber-500">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Estado Cuenta *</label>
            <select required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-amber-500">
              <option value="ACTIVO" selected>Activo</option>
              <option value="INACTIVO">Inactivo / Suspendido</option>
            </select>
          </div>
        </div>

        <div class="pt-4 flex items-center justify-end gap-3 border-t border-slate-100">
          <a href="usuarios-list.html" class="px-5 py-2.5 rounded-xl border border-slate-300 text-slate-700 font-semibold text-xs hover:bg-slate-50 transition">Cancelar</a>
          <button type="submit" class="px-6 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs shadow-md shadow-amber-500/20 transition flex items-center gap-2">
            <i class="fa-solid fa-floppy-disk"></i> Actualizar Usuario
          </button>
        </div>

      </form>
    </main>
  </div>

</body>
</html>
