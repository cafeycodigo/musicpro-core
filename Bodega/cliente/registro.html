<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicPro Bodega | Registro de Nueva Sucursal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            heading: ['"Outfit"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <script src="../../shared/modal-system.js"></script>
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/cliente/login.css">
</head>
<body class="min-h-full flex flex-col justify-between font-sans text-slate-800 bg-slate-50 antialiased">

  <!-- Top bar -->
  <header class="p-4 sm:p-6 flex items-center justify-between max-w-7xl mx-auto w-full">
    <a href="index.html" class="flex items-center gap-3 group">
      <div class="w-10 h-10 rounded-xl bg-amber-500 flex items-center justify-center text-slate-950 font-bold text-lg shadow-md shadow-amber-500/20 group-hover:scale-105 transition-transform">
        <i class="fa-solid fa-boxes-stacked"></i>
      </div>
      <div>
        <span class="font-heading font-bold text-slate-900 text-base leading-tight block">MusicPro WMS</span>
        <span class="text-[10px] text-amber-600 font-semibold uppercase tracking-wider">Red de Sucursales</span>
      </div>
    </a>

    <a href="index.html" class="px-3.5 py-2 rounded-xl bg-white hover:bg-slate-100 text-slate-600 text-xs font-semibold border border-slate-200 transition flex items-center gap-1.5 shadow-xs">
      <i class="fa-solid fa-arrow-left text-slate-400"></i>
      <span>Volver al Portal</span>
    </a>
  </header>

  <!-- Register Card Center -->
  <main class="flex-1 flex items-center justify-center p-4 sm:p-6">
    <div class="w-full max-w-md bg-white rounded-3xl p-8 border border-slate-200 shadow-xl space-y-6">
      
      <!-- Header -->
      <div class="text-center space-y-2">
        <div class="w-12 h-12 bg-amber-500/10 text-amber-600 rounded-2xl flex items-center justify-center mx-auto text-xl border border-amber-500/20 shadow-xs">
          <i class="fa-solid fa-building-circle-check"></i>
        </div>
        <h1 class="text-2xl font-bold font-heading text-slate-900">Solicitud de Registro</h1>
        <p class="text-xs text-slate-500">Alta de nueva sucursal o franquicia en la red de abastecimiento WMS</p>
      </div>

      <!-- Form -->
      <form onsubmit="event.preventDefault(); alert('Solicitud de alta enviada con éxito. Un supervisor validará la sucursal en 24h.'); window.location.href='login.html';" class="space-y-4 text-xs">
        <div>
          <label class="block font-semibold text-slate-700 mb-1.5">Nombre de la Sucursal / Punto de Venta</label>
          <div class="relative">
            <i class="fa-solid fa-store absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input type="text" required placeholder="Ej: Sucursal 06 - Antofagasta Center" class="w-full pl-9 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-amber-500">
          </div>
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1.5">RUT de la Empresa o Encargado</label>
          <div class="relative">
            <i class="fa-solid fa-id-card absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input type="text" required placeholder="76.123.456-7" class="w-full pl-9 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 font-mono font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-amber-500">
          </div>
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1.5">Correo Electrónico Institucional</label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input type="email" required placeholder="contacto@sucursal.cl" class="w-full pl-9 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-amber-500">
          </div>
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1.5">Contraseña Deseada</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input type="password" required placeholder="••••••••" class="w-full pl-9 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-amber-500">
          </div>
        </div>

        <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-xs shadow-lg shadow-amber-500/25 transition flex items-center justify-center gap-2 hover:scale-[1.01]">
          <i class="fa-solid fa-paper-plane"></i>
          <span>Enviar Solicitud de Registro</span>
        </button>
      </form>

      <!-- Login prompt -->
      <div class="pt-4 border-t border-slate-100 text-center text-xs text-slate-500">
        <span>¿Ya tienes una sucursal registrada? </span>
        <a href="login.html" class="font-bold text-amber-600 hover:underline">Inicia sesión aquí</a>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="p-4 text-center text-xs text-slate-400 border-t border-slate-200">
    <span>MusicPro WMS © 2026 • Registro protegido con encriptación SSL</span>
  </footer>

</body>
</html>
