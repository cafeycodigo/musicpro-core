<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicPro Express | Ingreso Remitentes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            heading: ['"Outfit"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <script src="../../shared/modal-system.js"></script>
</head>
<body class="min-h-full flex flex-col justify-between font-sans text-slate-800 bg-slate-50 antialiased">

  <!-- Header -->
  <header class="p-4 sm:p-6 flex items-center justify-between max-w-7xl mx-auto w-full">
    <a href="index.html" class="flex items-center gap-3 group">
      <div class="w-10 h-10 rounded-2xl bg-cyan-500 flex items-center justify-center text-slate-950 font-bold text-xl shadow-lg shadow-cyan-500/25 group-hover:rotate-6 transition-transform">
        <i class="fa-solid fa-truck-fast"></i>
      </div>
      <div>
        <span class="font-heading font-extrabold text-slate-900 text-lg leading-tight tracking-tight block">MusicPro <span class="text-cyan-600">Express</span></span>
        <span class="text-[10px] text-slate-400 font-medium uppercase tracking-wider">Transporte & Logística</span>
      </div>
    </a>

    <a href="index.html" class="px-3.5 py-2 rounded-xl bg-white hover:bg-slate-100 text-slate-600 text-xs font-semibold border border-slate-200 transition flex items-center gap-1.5 shadow-xs">
      <i class="fa-solid fa-arrow-left text-slate-400"></i>
      <span>Volver al Portal</span>
    </a>
  </header>

  <!-- Login Card Center -->
  <main class="flex-1 flex items-center justify-center p-4 sm:p-6">
    <div class="w-full max-w-md bg-white rounded-3xl p-8 border border-slate-200 shadow-xl space-y-6">
      
      <!-- Header -->
      <div class="text-center space-y-1.5">
        <div class="w-12 h-12 bg-cyan-500/10 text-cyan-600 rounded-2xl flex items-center justify-center mx-auto text-xl border border-cyan-500/20 shadow-xs mb-2">
          <i class="fa-solid fa-location-dot"></i>
        </div>
        <h1 class="text-2xl font-bold font-heading text-slate-900">Portal de Remitentes</h1>
        <p class="text-xs text-slate-500">Gestiona retiros, cotiza fletes y monitorea tus guías en ruta</p>
      </div>

      <!-- Account Type Pills -->
      <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl text-xs">
        <button type="button" onclick="setRemitenteType('EMP', this)" class="rem-tab py-1.5 rounded-lg font-bold bg-white text-slate-900 shadow-xs transition">
          Empresa / Retail
        </button>
        <button type="button" onclick="setRemitenteType('PART', this)" class="rem-tab py-1.5 rounded-lg font-medium text-slate-500 hover:text-slate-900 transition">
          Remitente Particular
        </button>
      </div>

      <!-- Form -->
      <form onsubmit="event.preventDefault(); handleLogin();" class="space-y-4 text-xs">
        <div>
          <label class="block font-semibold text-slate-700 mb-1.5" id="lblUser">RUT de Empresa o Email</label>
          <div class="relative">
            <i class="fa-solid fa-id-card absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input type="text" id="remUser" required value="76.840.119-2" placeholder="Ej: 76.840.119-2 o correo" class="w-full pl-9 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-cyan-500">
          </div>
        </div>

        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label class="font-semibold text-slate-700">Contraseña de Remitente</label>
            <button type="button" onclick="alert('Se ha enviado un enlace de recuperación a tu correo de contacto registrado.')" class="text-[11px] text-cyan-600 hover:underline">
              ¿Olvidaste tu contraseña?
            </button>
          </div>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input type="password" id="remPass" required value="••••••••" placeholder="Contraseña de acceso" class="w-full pl-9 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 focus:bg-white focus:outline-none focus:ring-2 focus:ring-cyan-500">
            <button type="button" onclick="togglePassVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
              <i class="fa-solid fa-eye text-xs" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between pt-1">
          <label class="flex items-center gap-2 cursor-pointer text-slate-600">
            <input type="checkbox" checked class="rounded border-slate-300 text-cyan-500 focus:ring-cyan-500">
            <span>Recordar este terminal</span>
          </label>
        </div>

        <button type="submit" class="w-full py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-xl text-xs shadow-lg shadow-cyan-500/25 transition flex items-center justify-center gap-2 hover:scale-[1.01]">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>Ingresar a Mis Despachos</span>
        </button>
      </form>

      <!-- Register prompt -->
      <div class="pt-4 border-t border-slate-100 text-center text-xs text-slate-500">
        <span>¿Aún no tienes cuenta para despachar? </span>
        <a href="registro.html" class="font-bold text-cyan-600 hover:underline">Regístrate como remitente aquí</a>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="p-4 text-center text-xs text-slate-400 border-t border-slate-200">
    <span>MusicPro Express Logística © 2026 • Plataforma de Envíos Segura</span>
  </footer>

  <script>
    function togglePassVisibility() {
      const input = document.getElementById('remPass');
      const icon = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-solid fa-eye-slash text-xs';
      } else {
        input.type = 'password';
        icon.className = 'fa-solid fa-eye text-xs';
      }
    }

    function setRemitenteType(type, btn) {
      document.querySelectorAll('.rem-tab').forEach(b => {
        b.className = "rem-tab py-1.5 rounded-lg font-medium text-slate-500 hover:text-slate-900 transition";
      });
      btn.className = "rem-tab py-1.5 rounded-lg font-bold bg-white text-slate-900 shadow-xs transition";
      const lbl = document.getElementById('lblUser');
      const input = document.getElementById('remUser');
      if (type === 'EMP') {
        lbl.textContent = "RUT de Empresa o Email";
        input.placeholder = "Ej: 76.840.119-2 o correo corporativo";
      } else {
        lbl.textContent = "RUT Personal o Correo";
        input.placeholder = "Ej: 18.940.122-3 o tu correo";
      }
    }

    function handleLogin() {
      window.location.href = "envios-list.html";
    }
  </script>
</body>
</html>
