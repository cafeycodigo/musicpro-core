<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transporte Express | Editar Datos de Envío</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            heading: ['"Outfit"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <script src="../../shared/modal-system.js"></script>
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/cliente/envios-edit.css">
</head>
<body class="min-h-full flex flex-col font-sans text-slate-800">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="envios-list.html" class="flex items-center gap-2 group text-slate-500 hover:text-slate-800">
        <div class="w-9 h-9 rounded-xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-600 group-hover:bg-cyan-500 group-hover:text-white transition">
          <i class="fa-solid fa-truck-fast"></i>
        </div>
        <div>
          <span class="font-heading font-bold text-base text-slate-900 leading-none block">Transporte<span class="text-cyan-500">Express</span></span>
          <span class="text-[10px] text-slate-400 font-medium tracking-wide">Modificar Envío</span>
        </div>
      </a>

      <a href="envios-list.html" class="text-xs font-semibold text-slate-600 hover:text-slate-900 transition flex items-center gap-1">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Volver a Envíos</span>
      </a>
    </div>
  </header>

  <main class="flex-1 max-w-3xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-6">
      <h1 class="font-heading font-extrabold text-2xl text-slate-900 tracking-tight">Modificar Datos de Envío TRK-2026-0042</h1>
      <p class="text-slate-500 text-xs sm:text-sm mt-0.5">Puedes actualizar los datos de contacto o referencias antes de la entrega final.</p>
    </div>

    <form onsubmit="handleEditShipping(event)" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8 space-y-6">
      
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">Código Guía (Inmutable)</label>
          <input type="text" value="TRK-2026-0042" disabled class="w-full bg-slate-100 border border-slate-200 rounded-lg px-3.5 py-2 text-xs font-mono font-bold text-slate-500 cursor-not-allowed">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">Nombre Destinatario</label>
          <input type="text" value="Benjamín Valenzuela" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2 text-xs text-slate-800 focus:bg-white focus:ring-2 focus:ring-cyan-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">Teléfono Destinatario</label>
          <input type="tel" value="+56 9 8472 1190" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2 text-xs text-slate-800 focus:bg-white focus:ring-2 focus:ring-cyan-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">Comuna</label>
          <input type="text" value="Providencia, Santiago" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2 text-xs text-slate-800 focus:bg-white focus:ring-2 focus:ring-cyan-500">
        </div>

        <div class="sm:col-span-2">
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">Dirección Exacta de Entrega</label>
          <input type="text" value="Av. Providencia 1240, Depto 504" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2 text-xs text-slate-800 focus:bg-white focus:ring-2 focus:ring-cyan-500">
        </div>

        <div class="sm:col-span-2">
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">Instrucciones de Reparto para el Conductor</label>
          <textarea rows="3" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2 text-xs text-slate-800 focus:bg-white focus:ring-2 focus:ring-cyan-500">Dejar en conserjería si no contesto el timbre.</textarea>
        </div>
      </div>

      <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
        <a href="envios-list.html" class="px-5 py-2.5 rounded-xl border border-slate-300 text-slate-700 text-xs font-semibold hover:bg-slate-100">
          Cancelar
        </a>
        <button type="submit" class="px-6 py-2.5 rounded-xl bg-cyan-600 hover:bg-cyan-700 text-white text-xs font-semibold shadow-md transition flex items-center gap-2">
          <i class="fa-solid fa-floppy-disk"></i>
          <span>Guardar Cambios</span>
        </button>
      </div>

    </form>
  </main>

  
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/cliente/envios-edit.js"></script>
</body>
</html>
