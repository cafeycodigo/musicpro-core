<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transporte Express | Guardar Nueva Dirección</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            heading: ['"Outfit"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <script src="../../shared/modal-system.js"></script>
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/cliente/direcciones-create.css">
</head>
<body class="min-h-full flex flex-col font-sans text-slate-800">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="direcciones-list.html" class="flex items-center gap-2 group text-slate-500 hover:text-slate-800">
        <div class="w-9 h-9 rounded-xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-600 group-hover:bg-cyan-500 group-hover:text-white transition">
          <i class="fa-solid fa-truck-fast"></i>
        </div>
        <div>
          <span class="font-heading font-bold text-base text-slate-900 leading-none block">Transporte<span class="text-cyan-500">Express</span></span>
          <span class="text-[10px] text-slate-400 font-medium tracking-wide">Nueva Ubicación</span>
        </div>
      </a>

      <a href="direcciones-list.html" class="text-xs font-semibold text-slate-600 hover:text-slate-900 transition flex items-center gap-1">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Volver a Direcciones</span>
      </a>
    </div>
  </header>

  <main class="flex-1 max-w-2xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-6">
      <h1 class="font-heading font-extrabold text-2xl text-slate-900 tracking-tight">Registrar Dirección Frecuente</h1>
      <p class="text-slate-500 text-xs sm:text-sm mt-0.5">Guarda los datos de retiro o entrega para seleccionarlos en un clic al cotizar.</p>
    </div>

    <form onsubmit="handleCreateAddress(event)" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8 space-y-5">
      
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div class="sm:col-span-2">
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">Etiqueta o Nombre de Ubicación <span class="text-rose-500">*</span></label>
          <input type="text" required placeholder="Ej: Sucursal Las Condes o Taller de Luthier" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2 text-xs text-slate-800 focus:bg-white focus:ring-2 focus:ring-cyan-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">Nombre de Contacto / Encargado <span class="text-rose-500">*</span></label>
          <input type="text" required placeholder="Ej: Andrea Soto" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2 text-xs text-slate-800 focus:bg-white focus:ring-2 focus:ring-cyan-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">Teléfono Móvil <span class="text-rose-500">*</span></label>
          <input type="tel" required placeholder="+56 9 1234 5678" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2 text-xs text-slate-800 focus:bg-white focus:ring-2 focus:ring-cyan-500">
        </div>

        <div class="sm:col-span-2">
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">Dirección Completa <span class="text-rose-500">*</span></label>
          <input type="text" required placeholder="Calle, número, depto u oficina" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2 text-xs text-slate-800 focus:bg-white focus:ring-2 focus:ring-cyan-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">Comuna / Ciudad <span class="text-rose-500">*</span></label>
          <input type="text" required placeholder="Ej: Las Condes, Santiago" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2 text-xs text-slate-800 focus:bg-white focus:ring-2 focus:ring-cyan-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">Tipo de Ubicación</label>
          <select class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2 text-xs text-slate-800 focus:bg-white focus:ring-2 focus:ring-cyan-500">
            <option value="Sucursal">Sucursal MusicPro</option>
            <option value="Taller">Taller / Proveedor Técnico</option>
            <option value="Domicilio">Domicilio Particular</option>
            <option value="Oficina">Oficina Comercial</option>
          </select>
        </div>

        <div class="sm:col-span-2">
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">Referencias para el Transportista</label>
          <textarea rows="2" placeholder="Ej: Portón verde frente a la plaza, timbre 2..." class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2 text-xs text-slate-800 focus:bg-white focus:ring-2 focus:ring-cyan-500"></textarea>
        </div>
      </div>

      <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
        <a href="direcciones-list.html" class="px-5 py-2.5 rounded-xl border border-slate-300 text-slate-700 text-xs font-semibold hover:bg-slate-100">
          Cancelar
        </a>
        <button type="submit" class="px-6 py-2.5 rounded-xl bg-cyan-600 hover:bg-cyan-700 text-white text-xs font-semibold shadow-md transition flex items-center gap-2">
          <i class="fa-solid fa-floppy-disk"></i>
          <span>Guardar Dirección</span>
        </button>
      </div>

    </form>
  </main>

  
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/cliente/direcciones-create.js"></script>
</body>
</html>
