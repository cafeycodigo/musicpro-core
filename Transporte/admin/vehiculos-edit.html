<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transporte Admin | Modificar Vehículo JW-89-21</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            heading: ['"Outfit"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <script src="../../shared/modal-system.js"></script>
  <script src="../../shared/admin-sidebar.js"></script>
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/admin/vehiculos-edit.css">
</head>
<body class="min-h-full flex font-sans text-slate-800">

  <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between flex-shrink-0 z-40 border-r border-slate-800">
    <div>
      <div class="h-16 px-6 flex items-center justify-between border-b border-slate-800">
        <a href="../../index.html" class="flex items-center gap-3 group">
          <div class="w-9 h-9 rounded-xl bg-cyan-500 flex items-center justify-center text-slate-950 font-bold text-lg shadow-lg shadow-cyan-500/20">
            <i class="fa-solid fa-route"></i>
          </div>
          <div>
            <span class="font-heading font-bold text-white text-base leading-tight block">Torre Logística</span>
            <span class="text-[10px] text-cyan-400 font-medium uppercase tracking-wider">Flota & Despacho</span>
          </div>
        </a>
      </div>

      <div class="px-3 py-5 space-y-1">
        <a href="index.html" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl hover:bg-slate-800/80 hover:text-white text-slate-400 font-medium text-xs transition">
          <i class="fa-solid fa-tower-broadcast w-4 text-center"></i>
          <span>Torre de Control</span>
        </a>
        <a href="vehiculos-list.html" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl bg-cyan-500/10 text-cyan-400 font-semibold text-xs border border-cyan-500/20">
          <i class="fa-solid fa-truck w-4 text-center"></i>
          <span>Flota & Vehículos</span>
        </a>
        <a href="conductores-list.html" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl hover:bg-slate-800/80 hover:text-white text-slate-400 font-medium text-xs transition">
          <i class="fa-solid fa-id-card-clip w-4 text-center"></i>
          <span>Conductores</span>
        </a>
        <a href="rutas-list.html" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl hover:bg-slate-800/80 hover:text-white text-slate-400 font-medium text-xs transition">
          <i class="fa-solid fa-clipboard-list w-4 text-center"></i>
          <span>Planificador de Rutas</span>
        </a>
      </div>
    </div>

    <div class="p-4 border-t border-slate-800">
      <a href="vehiculos-list.html" class="w-full flex items-center justify-center gap-2 py-2 px-3 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300 hover:text-white transition">
        <i class="fa-solid fa-arrow-left text-cyan-400"></i>
        <span>Volver a Flota</span>
      </a>
    </div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 z-20">
      <div class="flex items-center gap-2 text-xs text-slate-500">
        <a href="vehiculos-list.html" class="hover:text-slate-800">Flota</a>
        <span>/</span>
        <span class="font-semibold text-slate-800">Modificar JW-89-21</span>
      </div>
      <a href="../../index.html" class="p-2 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition">
        <i class="fa-solid fa-house"></i>
      </a>
    </header>

    <main class="flex-1 overflow-y-auto p-6 sm:p-8">
      <div class="max-w-3xl mx-auto">
        <div class="mb-6">
          <h1 class="font-heading font-extrabold text-2xl text-slate-900 tracking-tight">Editar Vehículo: Peugeot Partner JW-89-21</h1>
          <p class="text-slate-500 text-xs sm:text-sm mt-0.5">Asignación de chofer responsable, kilometraje y estado operativo.</p>
        </div>

        <form onsubmit="handleEditVehicle(event)" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8 space-y-6">
          
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1.5">Patente / Matrícula</label>
              <input type="text" value="JW-89-21" disabled class="w-full bg-slate-100 border border-slate-200 rounded-lg px-3.5 py-2 text-xs font-mono font-bold text-slate-500 cursor-not-allowed">
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1.5">Estado Operativo</label>
              <select class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2 text-xs text-slate-800 focus:bg-white focus:ring-2 focus:ring-cyan-500">
                <option value="Operación" selected>En Operación (En ruta activa)</option>
                <option value="Disponible">Disponible en Base</option>
                <option value="Mantenimiento">En Taller / Mantención de 20.000 km</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1.5">Conductor Asignado</label>
              <select class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2 text-xs text-slate-800 focus:bg-white focus:ring-2 focus:ring-cyan-500">
                <option value="Patricio Silva" selected>Patricio Silva (Licencia A4 - Vigente)</option>
                <option value="Rodrigo Fuentes">Rodrigo Fuentes (Licencia A4 - Vigente)</option>
                <option value="Sin asignar">Sin chofer fijo</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1.5">Kilometraje Actual (km)</label>
              <input type="number" value="18420" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2 text-xs text-slate-800 focus:bg-white focus:ring-2 focus:ring-cyan-500">
            </div>
          </div>

          <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
            <a href="vehiculos-list.html" class="px-5 py-2.5 rounded-xl border border-slate-300 text-slate-700 text-xs font-semibold hover:bg-slate-100">
              Cancelar
            </a>
            <button type="submit" class="px-6 py-2.5 rounded-xl bg-cyan-600 hover:bg-cyan-700 text-white text-xs font-semibold shadow-md transition flex items-center gap-2">
              <i class="fa-solid fa-floppy-disk"></i>
              <span>Guardar Modificaciones</span>
            </button>
          </div>

        </form>
      </div>
    </main>
  </div>

  
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/admin/vehiculos-edit.js"></script>
</body>
</html>
