<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicPro Store | Checkout - Paso 1: Datos y Despacho</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            heading: ['"Outfit"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <script src="../../shared/modal-system.js"></script>
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/cliente/checkout-step1.css">
</head>
<body class="min-h-full flex flex-col font-sans text-slate-800">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="tienda-catalog.html" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center text-white text-xl shadow-lg shadow-emerald-500/20">
          <i class="fa-solid fa-guitar"></i>
        </div>
        <div>
          <span class="font-heading font-extrabold text-xl text-slate-900 leading-tight block">MusicPro<span class="text-emerald-500">Store</span></span>
          <span class="text-[10px] text-slate-400 font-medium">Checkout Seguro</span>
        </div>
      </a>

      <!-- Steps Indicator -->
      <div class="flex items-center gap-3 text-xs font-semibold">
        <span class="flex items-center gap-1.5 text-emerald-600">
          <span class="w-6 h-6 rounded-full bg-emerald-600 text-white flex items-center justify-center text-xs">1</span>
          <span>Despacho</span>
        </span>
        <span class="text-slate-300">&rarr;</span>
        <span class="flex items-center gap-1.5 text-slate-400">
          <span class="w-6 h-6 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center text-xs">2</span>
          <span>Pago</span>
        </span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">

    <div class="mb-8">
      <h1 class="font-heading font-extrabold text-2xl sm:text-3xl text-slate-900 tracking-tight">Información de Entrega</h1>
      <p class="text-slate-500 text-xs sm:text-sm mt-0.5">Ingresa los datos para coordinar el envío de tus instrumentos con nuestra flota logística.</p>
    </div>

    <form action="checkout-step2.html" method="GET" class="space-y-6">

      <!-- Datos Personales -->
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8 space-y-5">
        <h2 class="font-heading font-bold text-base text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-user text-emerald-600"></i>
          <span>1. Datos del Comprador</span>
        </h2>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Nombre Completo <span class="text-rose-500">*</span></label>
            <input type="text" required value="Benjamín Valenzuela" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2.5 text-xs text-slate-800 focus:bg-white focus:ring-2 focus:ring-emerald-500">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Correo Electrónico <span class="text-rose-500">*</span></label>
            <input type="email" required value="benjamin@musicpro.cl" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2.5 text-xs text-slate-800 focus:bg-white focus:ring-2 focus:ring-emerald-500">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1.5">RUT / Cédula de Identidad <span class="text-rose-500">*</span></label>
            <input type="text" required value="18.943.201-9" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2.5 text-xs text-slate-800 focus:bg-white focus:ring-2 focus:ring-emerald-500">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Teléfono Móvil de Contacto <span class="text-rose-500">*</span></label>
            <input type="tel" required value="+56 9 8472 1190" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2.5 text-xs text-slate-800 focus:bg-white focus:ring-2 focus:ring-emerald-500">
          </div>
        </div>
      </div>

      <!-- Dirección de Despacho -->
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8 space-y-5">
        <h2 class="font-heading font-bold text-base text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-location-dot text-emerald-600"></i>
          <span>2. Dirección de Despacho</span>
        </h2>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-5">
          <div class="sm:col-span-2">
            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Calle y Número <span class="text-rose-500">*</span></label>
            <input type="text" required value="Av. Providencia 1240, Depto 504" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2.5 text-xs text-slate-800 focus:bg-white focus:ring-2 focus:ring-emerald-500">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Comuna / Ciudad <span class="text-rose-500">*</span></label>
            <select required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2.5 text-xs text-slate-800 focus:bg-white focus:ring-2 focus:ring-emerald-500">
              <option value="Providencia" selected>Providencia (Santiago)</option>
              <option value="Las Condes">Las Condes (Santiago)</option>
              <option value="Santiago Centro">Santiago Centro</option>
              <option value="Ñuñoa">Ñuñoa</option>
              <option value="Viña del Mar">Viña del Mar (Región de Valparaíso)</option>
            </select>
          </div>

          <div class="sm:col-span-3">
            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Instrucciones o Referencias para el Transportista</label>
            <textarea rows="2" placeholder="Ej: Dejar en conserjería si no contesto el timbre..." class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2.5 text-xs text-slate-800 focus:bg-white focus:ring-2 focus:ring-emerald-500"></textarea>
          </div>
        </div>
      </div>

      <!-- Action Footer -->
      <div class="flex items-center justify-between pt-2">
        <a href="carrito-view.html" class="text-xs font-semibold text-slate-600 hover:text-slate-900 transition flex items-center gap-1.5">
          <i class="fa-solid fa-arrow-left"></i>
          <span>Volver al Carrito</span>
        </a>

        <button type="submit" class="px-8 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-heading font-bold text-sm shadow-md transition flex items-center gap-2">
          <span>Continuar al Pago (Paso 2)</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </div>

    </form>

  </main>

  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/cliente/checkout-step1.js"></script>
</body>
</html>
